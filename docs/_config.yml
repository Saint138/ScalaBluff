title: "ScalaBluff"
description: "Project Documentation"

# Tema
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# URL del sito (aggiorna se cambi repo o username)
url: "https://saint138.github.io"
baseurl: "/ScalaBluff"

# Skin grafica (altre: default, air, contrast, neon…)
minimal_mistakes_skin: "dark"

# Plugin
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

# Navigazione: includi docs e pagine extra
include:
  - _pages
  - docs

# Ricerca lato client
search: true

# Autore (mostrato nel footer)
author:
  name: "ScalaBluff Team"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Saint138/ScalaBluff"

# Link nel footer
footer:
  links:
    - label: "Repository"
      icon: "fab fa-github"
      url: "https://github.com/Saint138/ScalaBluff"

# Default per i file dentro docs/
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: single
      classes: wide
      toc: true
      toc_sticky: true
      sidebar:
        nav: "docs"   # menu definito in _data/navigation.yml
